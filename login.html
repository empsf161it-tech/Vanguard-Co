<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Portal Login | Vanguard & Partners</title>
  <meta name="description" content="Secure Client & Counsel Portal Login for Vanguard & Partners Legal Counsel.">

  <!-- Remix Icon CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body>

  <!-- ================= AUTH CENTERED WRAPPER (NO HEADER / NO THEME TOGGLE) ================= -->
  <div class="auth-page-wrapper">
    <div class="auth-card">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-block-end: 1.5rem;">
        <i class="ri-scales-3-line"></i>
        <span>Vanguard</span>
      </a>

      <h2 style="font-size: 1.8rem; margin-block-end: 0.5rem;">Client Portal Login</h2>
      <p style="font-size: 0.9rem; color: var(--text-muted); margin-block-end: 2rem;">Enter your confidential credentials to access active case dockets.</p>

      <form data-validate="true">
        <div class="form-group">
          <label class="form-label" for="email">Corporate Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="counsel@company.com" required>
          <span class="error-message">Please enter a valid email address.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Encrypted Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          <span class="error-message">Password must be at least 8 characters.</span>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-block-start: 0.5rem;">Login</button>
        <div class="form-success-alert">Credentials verified. Redirecting to Client Portal...</div>
      </form>

      <div class="auth-divider">
        <span>or sign in with</span>
      </div>

      <!-- Social Auth Buttons -->
      <button class="social-auth-btn" type="button" onclick="window.location.href='dashboard.html'">
        <i class="ri-google-fill" style="color: #ea4335;"></i> Continue with Google
      </button>

      <button class="social-auth-btn" type="button" onclick="window.location.href='dashboard.html'">
        <i class="ri-apple-fill"></i> Continue with Apple
      </button>

      <p style="margin-block-start: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have a portal account? <a href="register.html" style="color: var(--secondary); font-weight: 600;">Register Here</a>
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
